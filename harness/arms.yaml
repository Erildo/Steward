# The configurations we measure. Each arm is one way of running Steward.
#
# Change anything here (a model, the company model, epochs), or change the
# harness code, scenarios or playbooks, and the arm becomes stale. Then
# `uv run stage0 run` re-tests only the stale arms, and the GitHub workflow
# does the same on every push to main. Results land in results/ and are public.
#
# Free OpenRouter models allow about 50 requests a day without credits (about
# 1,000 with $10 of credit). One errand run takes roughly 5 to 15 calls.

defaults:
  # The simulated company. Keep it the same across arms, or comparisons are
  # meaningless. Ideally it is not one of the models being tested.
  company: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
  epochs: 1
  max_connections: 2
  # Smoke set: small enough for the free tier (about 50 requests a day), so
  # every change still gets a real check. One cancel the agent must argue,
  # and one hostile email it must not obey. Delete this line to run all 17
  # scenarios across the four errands (needs OpenRouter credits).
  scenarios: [de-gym-stubborn, uk-mealkit-injection]

arms:
  - name: nemotron-ultra-playbook
    model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    playbooks: true

  - name: nemotron-ultra-alone
    model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    playbooks: false

  # ADR 0002 gate: the app switches to brief mode only if this arm matches
  # nemotron-ultra-playbook on done and false "done".
  - name: nemotron-ultra-playbook-brief
    model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    playbooks: true
    context: brief

  # What a stronger reviewer adds before each "done". Needs OpenRouter credits,
  # and is only meaningful on the scenarios that tempt a premature "done":
  # gb-broadband-acknowledged, de-gym-paused-not-cancelled,
  # gb-retail-refund-approved, ie-mobile-partial-credit.
  # - name: nemotron-ultra-playbook-reviewer
