# Free checks on every change to the relay: fakes for mail, push and models, no keys.
name: Relay tests

on:
  push:
    paths: ["relay/**", "StewardCore/Tests/Conformance/relay_envelope.json", ".github/workflows/relay-tests.yml"]
  pull_request:
    paths: ["relay/**", "StewardCore/Tests/Conformance/relay_envelope.json"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
