# Free checks on every change to the harness: scripted mock models, no API keys.
name: Harness tests

on:
  push:
    paths: ["harness/**", "!harness/results/**", ".github/workflows/harness-tests.yml"]
  pull_request:
    paths: ["harness/**", "!harness/results/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q
